<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi-AI | Enterprise Document Intelligence</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 30px auto; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input[type="file"], input[type="text"] { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
        button:hover { background: #2563eb; }
        #answerBox { white-space: pre-wrap; background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #3b82f6; min-height: 50px; }
        .status { margin-top: 10px; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>
    <h2>🚀 Lumi-AI: Zero-Cost Document RAG Portal</h2>
    
    <div class="card">
        <h3>Upload PDF Document</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="pdf" accept=".pdf" required />
            <button type="submit">Process & Index PDF</button>
        </form>
        <div id="uploadStatus" class="status"></div>
    </div>

    <div class="card">
        <h3>2. Ask Questions From Your PDF</h3>
        <input type="text" id="question" placeholder="Ask anything about the uploaded document..." />
        <button onclick="askQuestion()">Ask Lumi-AI</button>
        <div id="answerBox">Upload a PDF above and ask a question to see grounded answers here.</div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            document.getElementById('uploadStatus').innerText = "Reading PDF & indexing text context...";
            const formData = new FormData(e.target);
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('uploadStatus').innerText = data.message || data.error;
            } catch(err) {
                document.getElementById('uploadStatus').innerText = "Error uploading file.";
            }
        };

        async function askQuestion() {
            const q = document.getElementById('question').value;
            if(!q) return alert("Please type a question!");
            document.getElementById('answerBox').innerText = "Analyzing context & generating answer via Groq...";
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                document.getElementById('answerBox').innerText = data.answer || data.error;
            } catch(err) {
                document.getElementById('answerBox').innerText = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
